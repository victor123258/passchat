<!-- GitHub Pages Single Page Application redirect/fallback -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Redirect 404s back to root with hash preserved
    sessionStorage.redirect = location.href;
    location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/' + location.hash);
  </script>
  <meta http-equiv="refresh" content="0;URL='./'">
</head>
<body>
</body>
</html>
